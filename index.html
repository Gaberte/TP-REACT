<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire de contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form class="formulaire" action="#" method="post">
    <h2>Contactez-nous</h2>
    <p class="sous-titre">Remplissez le formulaire ci-dessous</p>

    <div class="ligne">
      <div class="champ">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Dupont" required>
      </div>
      <div class="champ">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Marie" required>
      </div>
    </div>

    <div class="champ">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="marie.dupont@exemple.fr" required>
    </div>

    <div class="champ">
      <label for="telephone">Téléphone</label>
      <input type="tel" id="telephone" name="telephone" placeholder="06 12 34 56 78">
    </div>

    <button type="submit">Envoyer</button>
  </form>

</body>
</html>
